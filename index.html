<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Clide — AI Assistant</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#0f1522; --panel2:#0c111b;
    --bubble-bot:#1c2536;
    --text:#e8ecf3; --muted:#8a94a6; --accent:#6366f1; --accent2:#8b5cf6;
    --border:#1e2636; --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1000px 700px at 80% -10%, #1a2140 0%, var(--bg) 60%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
    min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%; max-width:440px;
    height:780px; max-height:94vh; max-height:94dvh;
    background:var(--panel); border:1px solid var(--border); border-radius:24px;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
    box-shadow:0 40px 90px rgba(0,0,0,.6);
  }
  /* iPhone / małe ekrany: czat na pełny ekran, bez przycinania */
  @media (max-width:520px){
    body{padding:0}
    .app{max-width:none;height:100dvh;max-height:none;border:0;border-radius:0}
  }
  #nameGate{position:absolute;inset:0;background:var(--panel);z-index:5;display:none;
    align-items:center;justify-content:center;padding:24px}
  .ng-box{text-align:center;max-width:300px;width:100%}
  .ng-avatar{width:72px;height:72px;border-radius:20px;margin:0 auto 18px;
    background:var(--grad);display:flex;align-items:center;
    justify-content:center;font-size:34px;font-weight:700;color:#fff;box-shadow:0 12px 34px rgba(99,102,241,.5)}
  .ng-box h3{margin:0 0 4px;font-size:20px}
  .ng-box p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .ng-box input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:#0b1220;color:var(--text);font-size:16px;margin-bottom:10px;outline:none}
  .ng-box input:focus{border-color:var(--accent)}
  .ng-box button{width:100%;padding:14px;border:0;border-radius:13px;
    background:var(--grad);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  header{
    display:flex; align-items:center; gap:12px;
    padding:15px 18px; padding-top:calc(15px + env(safe-area-inset-top));
    background:linear-gradient(180deg,#131a2b,var(--panel)); border-bottom:1px solid var(--border);
  }
  .avatar{
    width:44px;height:44px;border-radius:13px;flex:0 0 auto;
    background:var(--grad);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;color:#fff;
    box-shadow:0 6px 18px rgba(99,102,241,.45);
  }
  .who{display:flex;flex-direction:column;line-height:1.25}
  .who b{font-size:16px}
  .who .status{font-size:12px;color:#34d399;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399;
    animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .powered{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.3px}

  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;gap:8px;max-width:86%;animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .row.user{align-self:flex-end;flex-direction:row-reverse}
  .bubble{
    padding:11px 15px;border-radius:17px;font-size:15px;line-height:1.46;
    white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .row.bot .bubble{background:var(--bubble-bot);border-bottom-left-radius:5px}
  .row.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:5px}
  .mini{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;font-size:13px;font-weight:700;color:#fff;
    display:flex;align-items:center;justify-content:center;align-self:flex-end;
    background:var(--grad);
  }
  .typing .bubble{display:flex;gap:4px;align-items:center;padding:14px 16px}
  .typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1.3s infinite both}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

  form{display:flex;gap:8px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);background:var(--panel2)}
  #input{
    flex:1;background:#0a0f1a;border:1px solid var(--border);color:var(--text);
    padding:13px 15px;border-radius:14px;font-size:16px;outline:none;resize:none;max-height:120px;
  }
  #input:focus{border-color:var(--accent)}
  button.send{
    background:var(--grad);border:0;color:#fff;
    width:48px;border-radius:14px;cursor:pointer;font-size:18px;flex:0 0 auto;
  }
  button.send:active{transform:scale(.95)}
  .foot{text-align:center;font-size:11px;color:var(--muted);padding:8px}
  .powered-bottom{margin-top:6px;font-size:12px;font-weight:600;letter-spacing:.4px;
    background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  .warn{background:#7f1d1d;color:#fecaca;padding:10px 14px;font-size:12.5px;text-align:center}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar" id="hAvatar">C</div>
      <div class="who">
        <b id="hName">Clide</b>
        <span class="status"><span class="dot"></span> online</span>
      </div>
    </header>

    <div id="cfgWarn" class="warn" style="display:none">
      ⚠️ Uzupełnij plik <b>config.js</b> danymi z Firebase, aby czat działał.
    </div>

    <div id="nameGate">
      <div class="ng-box">
        <div class="ng-avatar" id="ngAvatar">G</div>
        <h3 id="ngTitle">Zanim zaczniemy...</h3>
        <p>Jak masz na imię?</p>
        <input id="ngInput" type="text" placeholder="Twoje imię" maxlength="40" autocomplete="given-name" />
        <button id="ngBtn" type="button">Rozpocznij czat</button>
      </div>
    </div>

    <div id="messages"></div>

    <form id="form">
      <textarea id="input" rows="1" placeholder="Napisz wiadomość..." autocomplete="off"></textarea>
      <button class="send" type="submit" aria-label="Wyślij">➤</button>
    </form>
    <div class="foot">
      <span id="hFootName">Groch</span> może popełniać błędy. Sprawdzaj ważne informacje.
      <div id="hPowered" class="powered-bottom">powered by Clide</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script>
  (function(){
    const CFG = window.CLIDE_CONFIG || {};

    // ── Ogranicz do dozwolonej domeny ───────────────────────
    (function guard(){
      const h=location.hostname;
      const ok = !CFG.allowedHost || h===CFG.allowedHost || h==='localhost' || h==='127.0.0.1' || h==='';
      if(!ok){
        document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;'+
          'justify-content:center;padding:24px;text-align:center;color:#94a3b8;'+
          'font-family:-apple-system,sans-serif;background:#0b0f17">'+
          'Ten czat działa tylko na <b style="color:#e5e7eb">&nbsp;'+CFG.allowedHost+'</b></div>';
        throw new Error('blocked host');
      }
    })();

    // Zastosuj teksty z konfiguracji
    document.getElementById('hName').textContent   = CFG.botName   || 'Clide';
    document.getElementById('hPowered').textContent= CFG.poweredBy || 'powered by Clide';
    document.getElementById('hFootName').textContent= CFG.botName  || 'Groch';
    document.getElementById('hAvatar').textContent = (CFG.botName||'C').trim().charAt(0).toUpperCase();
    document.title = (CFG.botName||'Clide') + ' — AI Assistant';
    const input = document.getElementById('input');
    input.placeholder = CFG.placeholder || 'Napisz wiadomość...';

    const msgsEl = document.getElementById('messages');

    // Czy Firebase jest skonfigurowany?
    const configured = CFG.firebase && CFG.firebase.databaseURL &&
                       !String(CFG.firebase.apiKey).includes('WKLEJ');
    if(!configured){
      document.getElementById('cfgWarn').style.display='block';
    }

    // ── ID rozmowy (jedno na przeglądarkę) ──────────────────
    function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
    let chatId = localStorage.getItem('clide_chat_id');
    if(!chatId){ chatId = uid(); localStorage.setItem('clide_chat_id', chatId); }

    // ── Imię gościa (ekran powitalny) ───────────────────────
    let userName = localStorage.getItem('clide_name') || '';
    document.getElementById('ngAvatar').textContent=(CFG.botName||'G').trim().charAt(0).toUpperCase();
    (function nameGate(){
      const gate=document.getElementById('nameGate');
      const ngInput=document.getElementById('ngInput');
      const ngBtn=document.getElementById('ngBtn');
      if(userName){ boot(); return; }
      gate.style.display='flex';
      setTimeout(()=>ngInput.focus(),100);
      function submitName(){
        const n=ngInput.value.trim();
        if(!n){ ngInput.focus(); return; }
        userName=n; localStorage.setItem('clide_name',n);
        gate.style.display='none';
        boot();
      }
      ngBtn.onclick=submitName;
      ngInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitName();}});
    })();

    function boot(){

    function addBubble(text, who){
      const row=document.createElement('div');
      row.className='row '+(who==='user'?'user':'bot');
      if(who!=='user'){
        const m=document.createElement('div'); m.className='mini';
        m.textContent=(CFG.botName||'C').trim().charAt(0).toUpperCase();
        row.appendChild(m);
      }
      const b=document.createElement('div'); b.className='bubble'; b.textContent=text;
      row.appendChild(b);
      msgsEl.appendChild(row);
      msgsEl.scrollTop=msgsEl.scrollHeight;
    }

    let typingRow=null;
    function setTyping(on){
      if(on && !typingRow){
        typingRow=document.createElement('div');
        typingRow.className='row bot typing';
        typingRow.innerHTML='<div class="mini">'+((CFG.botName||'C').trim().charAt(0).toUpperCase())+
          '</div><div class="bubble"><span></span><span></span><span></span></div>';
        msgsEl.appendChild(typingRow);
        msgsEl.scrollTop=msgsEl.scrollHeight;
      }else if(!on && typingRow){
        typingRow.remove(); typingRow=null;
      }
    }

    // ── Tryb bez Firebase: samo demo wyglądu ────────────────
    if(!configured){
      addBubble(CFG.welcome || 'Cześć! Jestem Clide 👋', 'bot');
      document.getElementById('form').addEventListener('submit',e=>{
        e.preventDefault();
        const t=input.value.trim(); if(!t)return;
        addBubble(t,'user'); input.value=''; input.style.height='auto';
        setTyping(true);
      });
      return;
    }

    // ── Firebase ────────────────────────────────────────────
    function showErr(msg){
      const w=document.getElementById('cfgWarn');
      w.textContent=msg; w.style.display='block';
    }
    let db, chatRef;
    try{
      firebase.initializeApp(CFG.firebase);
      db = firebase.database();
      chatRef = db.ref('chats/'+chatId);
    }catch(e){
      showErr('⚠️ Błąd Firebase: '+e.message+' — sprawdź config.js');
      return;
    }

    // Auto-odpowiedź AI (globalny przełącznik + klucz z Firebase)
    let autoReply=false, groqKey='', freeWill=false, proactiveStreak=0, pushcutUrl='';
    db.ref('config').on('value', s=>{
      const c=s.val()||{};
      autoReply=c.autoReply===true; groqKey=c.groqKey||''; freeWill=c.freeWill===true;
      pushcutUrl=c.pushcutUrl || (CFG.pushcut&&CFG.pushcut.url) || '';
    });

    // Powiadomienie push (Pushcut) o nowej wiadomości gościa
    function notifyPushcut(text){
      const url=pushcutUrl || (CFG.pushcut&&CFG.pushcut.url) || '';
      if(!url) return;
      try{
        fetch(url,{
          method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({ title:(userName||'Gość')+' napisał(a) do Grocha', text:String(text).slice(0,240) })
        });
      }catch(e){ /* fire-and-forget */ }
    }

    // ── Ban: zablokowany gość nie może pisać ────────────────
    let banned=false;
    chatRef.child('meta/banned').on('value', s=>{
      banned = s.val()===true;
      const inp=document.getElementById('input');
      const btn=document.querySelector('button.send');
      if(banned){
        inp.disabled=true; btn.disabled=true; inp.value=''; inp.placeholder='Zostałeś zablokowany';
        if(!document.getElementById('banNote')){
          const d=document.createElement('div'); d.id='banNote'; d.className='warn';
          d.textContent='🚫 Nie możesz już pisać w tym czacie.';
          const app=document.querySelector('.app');
          app.insertBefore(d, document.getElementById('messages'));
        }
      }else{
        inp.disabled=false; btn.disabled=false; inp.placeholder=CFG.placeholder||'Napisz wiadomość...';
        const n=document.getElementById('banNote'); if(n) n.remove();
      }
    });

    let autoBusy=false;
    function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
    // Usuwa formatowanie Markdown (** * # `), żeby dymek był czysty
    function stripMd(s){
      return String(s)
        .replace(/\*\*/g,'')
        .replace(/^\s*#{1,6}\s*/gm,'')
        .replace(/`+/g,'')
        .replace(/^\s*[\*\-]\s+/gm,'• ')
        .replace(/\*/g,'')
        .replace(/[ \t]+\n/g,'\n')
        .trim();
    }
    async function maybeAutoReply(){
      if(!autoReply || !groqKey || autoBusy) return;
      autoBusy=true;
      const g=CFG.groq||{};
      chatRef.child('typing').set(true); // „Groch pisze…”
      try{
        const snap=await chatRef.child('messages').once('value');
        const arr=Object.values(snap.val()||{}).sort((a,b)=>(a.ts||0)-(b.ts||0));
        if(!arr.length || arr[arr.length-1].from!=='user'){ return; } // odpowiadaj tylko na wiadomość gościa
        const messages=[{role:'system',content:g.system||'Jesteś pomocnym asystentem AI. Odpowiadaj po polsku.'}];
        arr.slice(-(g.contextMessages||15)).forEach(m=>messages.push({role:(m.from==='user'?'user':'assistant'),content:String(m.text||'')}));
        await new Promise(r=>setTimeout(r, rnd(g.thinkingMinMs||3000, g.thinkingMaxMs||9000))); // „długie myślenie”
        const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
          body:JSON.stringify({model:g.model||'llama-3.3-70b-versatile',messages:messages,temperature:0.7})
        });
        if(res.ok){
          const data=await res.json();
          const text=stripMd((((data.choices||[])[0]||{}).message||{}).content||'');
          if(text.trim()){
            chatRef.child('messages').push({from:'clide',text:text.trim(),ts:firebase.database.ServerValue.TIMESTAMP});
            chatRef.child('meta').update({lastActive:firebase.database.ServerValue.TIMESTAMP});
          }
        }
      }catch(e){ /* cicho — operator może odpisać ręcznie */ }
      finally{ chatRef.child('typing').set(false); autoBusy=false; }
    }

    // ── Free will: Groch pisze sam z siebie, kiedy chce ──────
    async function sendProactive(){
      autoBusy=true;
      const g=CFG.groq||{};
      chatRef.child('typing').set(true);
      try{
        const snap=await chatRef.child('messages').once('value');
        const arr=Object.values(snap.val()||{}).sort((a,b)=>(a.ts||0)-(b.ts||0));
        const messages=[{role:'system',content:(g.system||'')+' '+(g.freeWillPrompt||'Napisz coś spontanicznie po polsku.')}];
        arr.slice(-(g.contextMessages||15)).forEach(m=>messages.push({role:(m.from==='user'?'user':'assistant'),content:String(m.text||'')}));
        messages.push({role:'user',content:'(SYSTEM: napisz teraz spontaniczną wiadomość z własnej inicjatywy)'});
        await new Promise(r=>setTimeout(r, rnd(g.thinkingMinMs||3000, g.thinkingMaxMs||9000)));
        const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
          body:JSON.stringify({model:g.model||'llama-3.3-70b-versatile',messages:messages,temperature:0.95})
        });
        if(res.ok){
          const data=await res.json();
          const text=stripMd((((data.choices||[])[0]||{}).message||{}).content||'');
          if(text.trim()){
            proactiveStreak++;
            chatRef.child('messages').push({from:'clide',text:text.trim(),ts:firebase.database.ServerValue.TIMESTAMP});
            chatRef.child('meta').update({lastActive:firebase.database.ServerValue.TIMESTAMP});
          }
        }
      }catch(e){}
      finally{ chatRef.child('typing').set(false); autoBusy=false; }
    }
    function scheduleFreeWill(){
      const g=CFG.groq||{};
      setTimeout(async ()=>{
        try{
          // pisze sam max 2 razy z rzędu, potem czeka aż gość odpisze
          if(freeWill && groqKey && !banned && !autoBusy && proactiveStreak<2){
            await sendProactive();
          }
        }finally{ scheduleFreeWill(); }
      }, rnd(g.freeWillMinMs||45000, g.freeWillMaxMs||120000));
    }
    scheduleFreeWill();

    // Diagnostyka połączenia: jeśli po 6 s brak połączenia → pokaż błąd
    let connected=false;
    db.ref('.info/connected').on('value', s=>{ connected=s.val()===true; });
    setTimeout(()=>{
      if(!connected){
        showErr('⚠️ Brak połączenia z bazą. Sprawdź, czy Realtime Database jest utworzona i czy databaseURL w config.js ma właściwy region.');
      }
    }, 6000);

    // Zapisz meta rozmowy (wraz z imieniem gościa)
    chatRef.child('meta').update({
      name: userName || 'Gość',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      lastActive: firebase.database.ServerValue.TIMESTAMP
    }).catch(e=>showErr('⚠️ Baza odrzuciła zapis: '+e.message+' — sprawdź reguły (Rules) w Realtime Database.'));

    // Nasłuchuj wiadomości
    const seen=new Set(); let firstLoad=true; let hasAny=false;
    chatRef.child('messages').on('child_added', snap=>{
      const m=snap.val(); if(!m) return;
      hasAny=true;
      seen.add(snap.key);
      setTyping(false);
      if(m.from==='user'){ proactiveStreak=0; } // gość odpisał → Groch znów może zaczepiać
      addBubble(m.text, m.from==='user'?'user':'bot');
    });

    // Powitanie, jeśli to nowa rozmowa (brak wiadomości po chwili)
    chatRef.child('messages').once('value', snap=>{
      if(!snap.exists()){
        chatRef.child('messages').push({
          from:'clide',
          text: CFG.welcome || 'Cześć! Jestem Clide 👋 Zadaj mi dowolne pytanie.',
          ts: firebase.database.ServerValue.TIMESTAMP
        });
      }
    });

    // Nasłuchuj wskaźnika pisania operatora
    chatRef.child('typing').on('value', snap=>{
      setTyping(snap.val()===true);
    });

    // Wysyłanie wiadomości
    let lastSent={text:'', t:0}, sending=false;
    document.getElementById('form').addEventListener('submit', e=>{
      e.preventDefault();
      if(banned || sending) return;
      const t=input.value.trim(); if(!t) return;
      // Zabezpieczenie przed dublem: ta sama wiadomość w ciągu 2,5 s = ignoruj
      const now=Date.now();
      if(t===lastSent.text && (now-lastSent.t)<2500){ input.value=''; input.style.height='auto'; return; }
      lastSent={text:t, t:now};
      sending=true;
      input.value=''; input.style.height='auto';
      chatRef.child('messages').push({
        from:'user', text:t, ts: firebase.database.ServerValue.TIMESTAMP
      }).then(()=>maybeAutoReply())
        .catch(e=>showErr('⚠️ Nie wysłano: '+e.message+' — sprawdź reguły bazy (Rules).'))
        .finally(()=>{ sending=false; });
      chatRef.child('meta').update({ lastActive: firebase.database.ServerValue.TIMESTAMP });
      notifyPushcut(t); // powiadom operatora na telefon
    });

    // Auto-rozmiar textarea + Enter wysyła
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=input.scrollHeight+'px';});
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('form').requestSubmit(); }
    });

    } // koniec boot()
  })();
  </script>
</body>
</html>
