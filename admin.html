<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Clide — Panel operatora</title>
<style>
  :root{
    --bg:#0a0e17; --panel:#0f1522; --panel2:#0c111b; --border:#1e2636;
    --text:#e8ecf3; --muted:#8a94a6; --accent:#6366f1; --accent2:#8b5cf6;
    --grad:linear-gradient(135deg,#6366f1,#8b5cf6);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1000px 700px at 85% -10%,#1a2140 0%,var(--bg) 60%);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* Logowanie */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(800px 600px at 50% 0%,#161d33,#0a0e17);z-index:10;padding:20px}
  #login .box{background:var(--panel);border:1px solid var(--border);padding:32px 28px;border-radius:20px;
    width:340px;max-width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  #login .lock{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;background:var(--grad);
    display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 10px 30px rgba(99,102,241,.45)}
  #login h1{margin:0 0 4px;font-size:21px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 20px}
  #login input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);margin-bottom:12px;font-size:16px;outline:none}
  #login input:focus{border-color:var(--accent)}
  #login button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--grad);color:#fff;
    font-weight:600;font-size:15px;cursor:pointer}

  .wrap{display:grid;grid-template-columns:320px 1fr;height:100vh;height:100dvh}
  .side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel2)}
  .side h2{font-size:15px;padding:18px 16px;padding-top:calc(18px + env(safe-area-inset-top));margin:0;
    border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:700}
  .badge{background:var(--grad);color:#fff;border-radius:20px;font-size:11px;padding:2px 9px;font-weight:600}
  #list{overflow-y:auto;flex:1}
  .chat{padding:12px 14px;border-bottom:1px solid rgba(30,38,54,.6);cursor:pointer;
    display:flex;gap:12px;align-items:center;transition:background .12s}
  .chat:hover{background:#131a29}
  .chat.active{background:#161f33;box-shadow:inset 3px 0 0 var(--accent)}
  .av{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:17px;color:#fff}
  .ci{flex:1;min-width:0}
  .chat .t{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .chat .nm{display:flex;align-items:center;gap:6px;min-width:0}
  .chat .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat .p{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .chat .time{font-size:11px;color:var(--muted);font-weight:400;flex:0 0 auto}
  .unread{width:9px;height:9px;border-radius:50%;background:#34d399;flex:0 0 auto;box-shadow:0 0 8px #34d399}

  .main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
  .mhead{padding:13px 16px;padding-top:calc(13px + env(safe-area-inset-top));border-bottom:1px solid var(--border);
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;position:relative;
    background:linear-gradient(180deg,#131a2b,var(--panel))}
  .iconbtn{background:#1c2536;border:0;color:var(--text);width:36px;height:36px;border-radius:11px;
    cursor:pointer;font-size:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .menu{position:absolute;top:calc(100% - 4px);right:12px;background:var(--panel);border:1px solid var(--border);
    border-radius:14px;box-shadow:0 22px 55px rgba(0,0,0,.55);padding:6px;display:none;z-index:30;min-width:200px}
  .menu.open{display:block}
  .menu button{display:flex;width:100%;gap:9px;align-items:center;background:transparent;border:0;
    color:var(--text);padding:12px;border-radius:10px;cursor:pointer;font-size:14px;text-align:left;font-weight:500}
  .menu button:hover{background:#161f33}
  .menu button[data-act="delete"]{color:#f87171}
  #mHeadText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  #mMsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;max-width:74%}
  .row.op{align-self:flex-end}
  .row.usr{align-self:flex-start}
  .bubble{padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;
    word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .row.op .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:5px}
  .row.usr .bubble{background:#1c2536;border-bottom-left-radius:5px}
  .empty{margin:auto;color:var(--muted);text-align:center;font-size:14px}
  form{display:flex;gap:8px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);background:var(--panel2)}
  #reply{flex:1;min-width:0;background:#0a0f1a;border:1px solid var(--border);color:var(--text);padding:12px 14px;
    border-radius:13px;resize:none;max-height:120px;outline:none;font-size:16px}
  #reply:focus{border-color:var(--accent)}
  .send{background:var(--grad);border:0;color:#fff;width:50px;border-radius:13px;cursor:pointer;font-size:18px;flex:0 0 auto}
  .send:active{transform:scale(.95)}
  .ai{background:var(--grad);border:0;color:#fff;padding:0 14px;border-radius:13px;cursor:pointer;
    font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto}
  .ai:disabled{opacity:.55;cursor:default}
  .hint{font-size:11px;color:var(--muted);padding:0 14px 12px;text-align:center}
  .typing-note{font-size:12px;color:#fbbf24;padding:6px 18px}

  /* Przełącznik (switch) */
  .switch{margin-left:auto;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
    font-size:12px;color:var(--muted);font-weight:600;flex:0 0 auto}
  .switch + .switch{margin-left:0}
  .switch input{display:none}
  .switch .track{width:42px;height:24px;border-radius:24px;background:#2a3446;position:relative;transition:.22s;flex:0 0 auto}
  .switch .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:19px;height:19px;border-radius:50%;
    background:#fff;transition:.22s;box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .switch input:checked + .track{background:var(--grad)}
  .switch input:checked + .track::after{transform:translateX(18px)}
  .switch input:checked ~ .lbl{color:var(--text)}

  #backBtn{display:none;background:#1c2536;border:0;color:var(--text);width:36px;height:36px;
    border-radius:11px;cursor:pointer;font-size:18px;align-items:center;justify-content:center;flex:0 0 auto}
  /* ── Telefon: jeden widok naraz ── */
  @media (max-width:720px){
    .wrap{grid-template-columns:1fr}
    .side{display:flex;border-right:0}
    .main{display:none}
    .wrap.chat-open .side{display:none}
    .wrap.chat-open .main{display:flex}
    .wrap.chat-open #backBtn{display:inline-flex}
    /* w nagłówku rozmowy zostają same ikony suwaków, żeby nic nie uciekało w bok */
    .mhead{gap:7px}
    .mhead .switch .lbl{display:none}
    .mhead .switch{gap:5px}
  }
</style>
</head>
<body>
  <div id="login">
    <div class="box">
      <div class="lock">🔒</div>
      <h1>Panel Groch</h1>
      <p>Wpisz hasło, aby zobaczyć rozmowy</p>
      <input id="pw" type="password" placeholder="Hasło" />
      <button id="loginBtn">Wejdź</button>
    </div>
  </div>

  <div class="wrap">
    <div class="side">
      <h2>Rozmowy <span class="badge" id="count">0</span>
        <label class="switch" title="Groch odpowiada sam, nawet gdy Cię nie ma"><span class="lbl">🤖 Auto</span><input type="checkbox" class="autoToggle"><span class="track"></span></label>
        <label class="switch" title="Groch pisze sam z siebie, kiedy chce"><span class="lbl">🎲 Sam</span><input type="checkbox" class="freeToggle"><span class="track"></span></label>
      </h2>
      <div id="list"></div>
    </div>
    <div class="main">
      <div class="mhead">
        <button id="backBtn" type="button" aria-label="Wróć">←</button>
        <span id="mHeadText">Wybierz rozmowę po lewej</span>
        <label class="switch" title="Auto: Groch odpowiada sam na pytania"><span class="ico">🤖</span><span class="lbl">Auto</span><input type="checkbox" class="autoToggle"><span class="track"></span></label>
        <label class="switch" title="Sam: Groch pisze z własnej inicjatywy"><span class="ico">🎲</span><span class="lbl">Sam</span><input type="checkbox" class="freeToggle"><span class="track"></span></label>
        <button id="menuBtn" class="iconbtn" type="button" aria-label="Menu" style="display:none">⋮</button>
        <div id="menu" class="menu">
          <button type="button" data-act="ban">🚫 <span id="banLabel">Zbanuj gościa</span></button>
          <button type="button" data-act="clear">🧹 Wyczyść kontekst</button>
          <button type="button" data-act="delete">🗑️ Usuń konto</button>
        </div>
      </div>
      <div id="mMsgs"><div class="empty">Brak wybranej rozmowy</div></div>
      <div class="typing-note" id="typingNote" style="display:none">✍️ Gość widzi teraz „Groch pisze..."</div>
      <form id="replyForm" style="display:none">
        <button class="ai" type="button" id="aiBtn" title="Podpowiedź AI (Groq)">✨ AI</button>
        <textarea id="reply" rows="1" placeholder="Odpowiedz jako Groch..."></textarea>
        <button class="send" type="submit">➤</button>
      </form>
      <div class="hint" id="hint" style="display:none">✨ AI = podpowiedź od Groq (możesz ją edytować) • Enter = wyślij</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script>
  (function(){
    const CFG=window.CLIDE_CONFIG||{};

    // ── Ogranicz do dozwolonej domeny ───────────────────────
    (function guard(){
      const h=location.hostname;
      const ok = !CFG.allowedHost || h===CFG.allowedHost || h==='localhost' || h==='127.0.0.1' || h==='';
      if(!ok){
        document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;'+
          'justify-content:center;padding:24px;text-align:center;color:#94a3b8;'+
          'font-family:-apple-system,sans-serif;background:#0b0f17">'+
          'Panel działa tylko na <b style="color:#e5e7eb">&nbsp;'+CFG.allowedHost+'</b></div>';
        throw new Error('blocked host');
      }
    })();

    const configured = CFG.firebase && CFG.firebase.databaseURL && !String(CFG.firebase.apiKey).includes('WKLEJ');

    // ── Logowanie (prosta bariera) ──────────────────────────
    const loginEl=document.getElementById('login');
    function tryLogin(){
      const pw=document.getElementById('pw').value;
      if(pw===(CFG.adminPassword||'zmien-to-haslo')){
        sessionStorage.setItem('clide_admin','1'); start();
      }else{ alert('Złe hasło'); }
    }
    document.getElementById('loginBtn').onclick=tryLogin;
    document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
    if(sessionStorage.getItem('clide_admin')==='1') start();

    function start(){
      loginEl.style.display='none';
      if(!configured){
        document.getElementById('mHeadText').textContent='⚠️ Uzupełnij config.js danymi z Firebase';
        return;
      }
      firebase.initializeApp(CFG.firebase);
      const db=firebase.database();
      run(db);
    }

    function fmtTime(ts){
      if(!ts) return '';
      const d=new Date(ts), n=new Date();
      const sameDay=d.toDateString()===n.toDateString();
      return sameDay ? d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})
                     : d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'});
    }

    function run(db){
      const listEl=document.getElementById('list');
      const countEl=document.getElementById('count');
      let chats={}; let current=null;
      document.getElementById('backBtn').onclick=()=>{
        document.querySelector('.wrap').classList.remove('chat-open');
        document.getElementById('menuBtn').style.display='none';
        current=null; renderList();
      };
      const lastSeen=JSON.parse(localStorage.getItem('clide_seen')||'{}');

      // Lista rozmów
      db.ref('chats').on('value', snap=>{
        chats=snap.val()||{};
        renderList();
      });

      function displayName(id){
        const c=chats[id];
        return (c && c.meta && c.meta.name) ? c.meta.name : ('Gość '+id.slice(0,5));
      }
      function avatarGrad(id){
        let h=0; for(let i=0;i<id.length;i++){ h=(h*31+id.charCodeAt(i))%360; }
        return 'linear-gradient(135deg,hsl('+h+',60%,56%),hsl('+((h+45)%360)+',62%,48%))';
      }

      function lastMsg(c){
        if(!c.messages) return {text:'(brak wiadomości)', ts:c.meta&&c.meta.lastActive};
        const keys=Object.keys(c.messages);
        const m=c.messages[keys[keys.length-1]];
        return {text:(m.from==='user'?'👤 ':'🤖 ')+m.text, ts:m.ts, from:m.from};
      }

      function renderList(){
        const ids=Object.keys(chats).sort((a,b)=>{
          const ta=(chats[a].meta&&chats[a].meta.lastActive)||0;
          const tb=(chats[b].meta&&chats[b].meta.lastActive)||0;
          return tb-ta;
        });
        countEl.textContent=ids.length;
        listEl.innerHTML='';
        ids.forEach(id=>{
          const c=chats[id]; const lm=lastMsg(c);
          const div=document.createElement('div');
          div.className='chat'+(current===id?' active':'');
          const unread = lm.from==='user' && (!lastSeen[id] || lastSeen[id] < lm.ts);
          const name=displayName(id);
          const initial=(name.trim().charAt(0)||'?').toUpperCase();
          div.innerHTML=
            '<div class="av" style="background:'+avatarGrad(id)+'">'+escapeHtml(initial)+'</div>'+
            '<div class="ci">'+
              '<div class="t"><span class="nm"><span>'+escapeHtml(name)+'</span>'+
                (unread?'<span class="unread"></span>':'')+'</span>'+
                '<span class="time">'+fmtTime(lm.ts)+'</span></div>'+
              '<div class="p">'+escapeHtml(lm.text||'').slice(0,60)+'</div>'+
            '</div>';
          div.onclick=()=>openChat(id);
          listEl.appendChild(div);
        });
      }

      function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

      let msgHandler=null, msgRef=null;
      function openChat(id){
        current=id; renderList();
        document.querySelector('.wrap').classList.add('chat-open');
        document.getElementById('menuBtn').style.display='flex';
        document.getElementById('mHeadText').textContent=displayName(id)+' — odpisujesz jako '+(CFG.botName||'Groch');
        document.getElementById('replyForm').style.display='flex';
        document.getElementById('hint').style.display='block';
        const mEl=document.getElementById('mMsgs'); mEl.innerHTML='';

        if(msgRef&&msgHandler) msgRef.off('child_added',msgHandler);
        msgRef=db.ref('chats/'+id+'/messages');
        msgHandler=msgRef.on('child_added',snap=>{
          const m=snap.val(); if(!m)return;
          const row=document.createElement('div');
          row.className='row '+(m.from==='user'?'usr':'op');
          row.innerHTML='<div class="bubble">'+escapeHtml(m.text)+'</div>';
          mEl.appendChild(row); mEl.scrollTop=mEl.scrollHeight;
          // oznacz jako przeczytane
          if(m.ts){ lastSeen[id]=Math.max(lastSeen[id]||0,m.ts); localStorage.setItem('clide_seen',JSON.stringify(lastSeen)); }
        });
      }

      // Odpowiedź jako Clide
      const reply=document.getElementById('reply');
      let typingTimer=null;
      function setOperatorTyping(on){
        if(!current) return;
        db.ref('chats/'+current+'/typing').set(on);
        document.getElementById('typingNote').style.display=on?'block':'none';
      }
      reply.addEventListener('input',()=>{
        reply.style.height='auto'; reply.style.height=reply.scrollHeight+'px';
        if(!current) return;
        setOperatorTyping(true);
        clearTimeout(typingTimer);
        typingTimer=setTimeout(()=>setOperatorTyping(false),3000);
      });
      reply.addEventListener('keydown',e=>{
        if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('replyForm').requestSubmit();}
      });
      document.getElementById('replyForm').addEventListener('submit',e=>{
        e.preventDefault();
        const t=reply.value.trim(); if(!t||!current)return;
        reply.value=''; reply.style.height='auto';
        clearTimeout(typingTimer); setOperatorTyping(false);
        db.ref('chats/'+current+'/messages').push({
          from:'clide', text:t, ts:firebase.database.ServerValue.TIMESTAMP
        });
        db.ref('chats/'+current+'/meta').update({lastActive:firebase.database.ServerValue.TIMESTAMP});
      });

      // ── Klucz Groq z Firebase (config/groqKey) ────────────
      let groqKey='';
      db.ref('config').on('value', s=>{
        const c=s.val()||{}; groqKey=c.groqKey||'';
      });

      // ── Przełączniki auto-odpowiedzi (menu + rozmowa) ─────
      const autoToggles=[...document.querySelectorAll('.autoToggle')];
      db.ref('config/autoReply').on('value', s=>{
        const on=s.val()===true; autoToggles.forEach(t=>t.checked=on);
      });
      autoToggles.forEach(t=>t.addEventListener('change', ()=>{
        const on=t.checked; db.ref('config/autoReply').set(on);
        autoToggles.forEach(o=>o.checked=on);
      }));

      // ── Przełączniki „free will” (Groch pisze sam z siebie) ─
      const freeToggles=[...document.querySelectorAll('.freeToggle')];
      db.ref('config/freeWill').on('value', s=>{
        const on=s.val()===true; freeToggles.forEach(t=>t.checked=on);
      });
      freeToggles.forEach(t=>t.addEventListener('change', ()=>{
        const on=t.checked; db.ref('config/freeWill').set(on);
        freeToggles.forEach(o=>o.checked=on);
      }));

      // ── Menu akcji: ban / kontekst / usuń ─────────────────
      const menuBtn=document.getElementById('menuBtn');
      const menu=document.getElementById('menu');
      const banLabel=document.getElementById('banLabel');
      menuBtn.addEventListener('click', e=>{
        e.stopPropagation();
        if(!current) return;
        const c=chats[current]; const banned=!!(c&&c.meta&&c.meta.banned);
        banLabel.textContent = banned ? 'Odbanuj gościa' : 'Zbanuj gościa';
        menu.classList.toggle('open');
      });
      document.addEventListener('click', ()=>menu.classList.remove('open'));
      menu.addEventListener('click', e=>e.stopPropagation());
      menu.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>{
        const act=b.dataset.act; const id=current;
        menu.classList.remove('open');
        if(!id) return;
        if(act==='ban'){
          const c=chats[id]; const banned=!!(c&&c.meta&&c.meta.banned);
          db.ref('chats/'+id+'/meta/banned').set(!banned);
        }else if(act==='clear'){
          if(confirm('Wyczyścić kontekst tej rozmowy? Groch zapomni całą historię.')){
            db.ref('chats/'+id+'/messages').remove();
            document.getElementById('mMsgs').innerHTML='';
          }
        }else if(act==='delete'){
          if(confirm('Usunąć całe konto gościa wraz z rozmową? Tego nie da się cofnąć.')){
            db.ref('chats/'+id).remove();
            current=null;
            document.querySelector('.wrap').classList.remove('chat-open');
            document.getElementById('menuBtn').style.display='none';
            document.getElementById('mMsgs').innerHTML='<div class="empty">Brak wybranej rozmowy</div>';
            document.getElementById('mHeadText').textContent='Wybierz rozmowę po lewej';
            document.getElementById('replyForm').style.display='none';
            document.getElementById('hint').style.display='none';
          }
        }
      }));

      // ── Przycisk „✨ AI”: propozycja odpowiedzi z Groq ─────
      const aiBtn=document.getElementById('aiBtn');
      function stripMd(s){
        return String(s)
          .replace(/\*\*/g,'')
          .replace(/^\s*#{1,6}\s*/gm,'')
          .replace(/`+/g,'')
          .replace(/^\s*[\*\-]\s+/gm,'• ')
          .replace(/\*/g,'')
          .replace(/[ \t]+\n/g,'\n')
          .trim();
      }
      async function askAI(){
        if(!current) return;
        if(!groqKey){
          alert('Brak klucza Groq.\nDodaj w Firebase → Realtime Database:\nconfig/groqKey = "gsk_..."');
          return;
        }
        const c=chats[current]; if(!c) return;
        const arr=Object.values(c.messages||{}).sort((a,b)=>(a.ts||0)-(b.ts||0));
        const g=CFG.groq||{};
        const messages=[{role:'system',content:g.system||'Jesteś pomocnym asystentem AI. Odpowiadaj po polsku.'}];
        arr.slice(-(g.contextMessages||15)).forEach(m=>messages.push({role:(m.from==='user'?'user':'assistant'),content:String(m.text||'')}));
        aiBtn.disabled=true; const old=aiBtn.textContent; aiBtn.textContent='…';
        try{
          const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
            body:JSON.stringify({model:g.model||'llama-3.3-70b-versatile',messages:messages,temperature:0.7})
          });
          if(!res.ok){ throw new Error('Groq '+res.status+': '+(await res.text()).slice(0,200)); }
          const data=await res.json();
          const text=stripMd((((data.choices||[])[0]||{}).message||{}).content||'');
          reply.value=text.trim();
          reply.dispatchEvent(new Event('input')); // auto-rozmiar + „Groch pisze”
          reply.focus();
        }catch(err){
          alert('Nie udało się pobrać podpowiedzi AI:\n'+err.message);
        }finally{
          aiBtn.disabled=false; aiBtn.textContent=old;
        }
      }
      aiBtn.addEventListener('click',askAI);
    }
  })();
  </script>
</body>
</html>
