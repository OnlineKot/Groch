<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Clide — Panel operatora</title>
<style>
  :root{--bg:#0b0f17;--panel:#111827;--border:#1f2937;--text:#e5e7eb;--muted:#94a3b8;--accent:#6366f1}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

  /* Logowanie */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:10}
  #login .box{background:var(--panel);border:1px solid var(--border);padding:28px;border-radius:16px;width:320px;text-align:center}
  #login h1{margin:0 0 4px;font-size:20px}
  #login p{color:var(--muted);font-size:13px;margin:0 0 18px}
  #login input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#0b1220;color:var(--text);margin-bottom:10px}
  #login button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}

  .wrap{display:grid;grid-template-columns:300px 1fr;height:100vh;height:100dvh}
  .side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
  .side h2{font-size:14px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));margin:0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .badge{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:2px 8px}
  .auto{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .auto input{accent-color:var(--accent);width:16px;height:16px}
  #list{overflow-y:auto;flex:1}
  .chat{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
  .chat:hover{background:#0f1626}
  .chat.active{background:#182136;border-left:3px solid var(--accent)}
  .chat .t{font-size:13px;font-weight:600;display:flex;justify-content:space-between}
  .chat .p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .chat .time{font-size:11px;color:var(--muted);font-weight:400}
  .unread{width:8px;height:8px;border-radius:50%;background:#34d399;display:inline-block;margin-left:6px}

  .main{display:flex;flex-direction:column;min-height:0}
  .mhead{padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border);font-size:14px;display:flex;align-items:center;gap:10px}
  #mMsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;max-width:70%}
  .row.op{align-self:flex-end}
  .row.usr{align-self:flex-start}
  .bubble{padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .row.op .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .row.usr .bubble{background:#1e293b;border-bottom-left-radius:4px}
  .empty{margin:auto;color:var(--muted);text-align:center}
  form{display:flex;gap:8px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
  #reply{flex:1;background:#0b1220;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:12px;resize:none;max-height:120px;outline:none}
  #reply:focus{border-color:var(--accent)}
  .send{background:var(--accent);border:0;color:#fff;width:52px;border-radius:12px;cursor:pointer;font-size:18px}
  .ai{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:0;color:#fff;padding:0 12px;
    border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;flex:0 0 auto}
  .ai:disabled{opacity:.55;cursor:default}
  .hint{font-size:11px;color:var(--muted);padding:0 14px 12px}
  .typing-note{font-size:12px;color:#fbbf24;padding:6px 18px}
  #backBtn{display:none;background:#1e293b;border:0;color:var(--text);width:34px;height:34px;
    border-radius:9px;cursor:pointer;font-size:18px;align-items:center;justify-content:center;flex:0 0 auto}
  /* ── Telefon: jeden widok naraz ── */
  @media (max-width:720px){
    .wrap{grid-template-columns:1fr}
    .side{display:flex}
    .main{display:none}
    .wrap.chat-open .side{display:none}
    .wrap.chat-open .main{display:flex}
    .wrap.chat-open #backBtn{display:inline-flex}
  }
</style>
</head>
<body>
  <div id="login">
    <div class="box">
      <h1>🔒 Panel Groch</h1>
      <p>Wpisz hasło, aby zobaczyć rozmowy</p>
      <input id="pw" type="password" placeholder="Hasło" />
      <button id="loginBtn">Wejdź</button>
    </div>
  </div>

  <div class="wrap">
    <div class="side">
      <h2>Rozmowy <span class="badge" id="count">0</span>
        <label class="auto" title="Groch odpowiada sam, nawet gdy Cię nie ma">
          <input type="checkbox" id="autoToggle"> 🤖 Auto-AI
        </label>
      </h2>
      <div id="list"></div>
    </div>
    <div class="main">
      <div class="mhead"><button id="backBtn" type="button" aria-label="Wróć">←</button><span id="mHeadText">Wybierz rozmowę po lewej</span></div>
      <div id="mMsgs"><div class="empty">Brak wybranej rozmowy</div></div>
      <div class="typing-note" id="typingNote" style="display:none">✍️ Gość widzi teraz „Groch pisze..."</div>
      <form id="replyForm" style="display:none">
        <button class="ai" type="button" id="aiBtn" title="Podpowiedź AI (Groq)">✨ AI</button>
        <textarea id="reply" rows="1" placeholder="Odpowiedz jako Groch..."></textarea>
        <button class="send" type="submit">➤</button>
      </form>
      <div class="hint" id="hint" style="display:none">✨ AI = podpowiedź od Groq (możesz ją edytować) • Enter = wyślij</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script>
  (function(){
    const CFG=window.CLIDE_CONFIG||{};

    // ── Ogranicz do dozwolonej domeny ───────────────────────
    (function guard(){
      const h=location.hostname;
      const ok = !CFG.allowedHost || h===CFG.allowedHost || h==='localhost' || h==='127.0.0.1' || h==='';
      if(!ok){
        document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;'+
          'justify-content:center;padding:24px;text-align:center;color:#94a3b8;'+
          'font-family:-apple-system,sans-serif;background:#0b0f17">'+
          'Panel działa tylko na <b style="color:#e5e7eb">&nbsp;'+CFG.allowedHost+'</b></div>';
        throw new Error('blocked host');
      }
    })();

    const configured = CFG.firebase && CFG.firebase.databaseURL && !String(CFG.firebase.apiKey).includes('WKLEJ');

    // ── Logowanie (prosta bariera) ──────────────────────────
    const loginEl=document.getElementById('login');
    function tryLogin(){
      const pw=document.getElementById('pw').value;
      if(pw===(CFG.adminPassword||'zmien-to-haslo')){
        sessionStorage.setItem('clide_admin','1'); start();
      }else{ alert('Złe hasło'); }
    }
    document.getElementById('loginBtn').onclick=tryLogin;
    document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
    if(sessionStorage.getItem('clide_admin')==='1') start();

    function start(){
      loginEl.style.display='none';
      if(!configured){
        document.getElementById('mHeadText').textContent='⚠️ Uzupełnij config.js danymi z Firebase';
        return;
      }
      firebase.initializeApp(CFG.firebase);
      const db=firebase.database();
      run(db);
    }

    function fmtTime(ts){
      if(!ts) return '';
      const d=new Date(ts), n=new Date();
      const sameDay=d.toDateString()===n.toDateString();
      return sameDay ? d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})
                     : d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'});
    }

    function run(db){
      const listEl=document.getElementById('list');
      const countEl=document.getElementById('count');
      let chats={}; let current=null;
      document.getElementById('backBtn').onclick=()=>{
        document.querySelector('.wrap').classList.remove('chat-open');
        current=null; renderList();
      };
      const lastSeen=JSON.parse(localStorage.getItem('clide_seen')||'{}');

      // Lista rozmów
      db.ref('chats').on('value', snap=>{
        chats=snap.val()||{};
        renderList();
      });

      function displayName(id){
        const c=chats[id];
        return (c && c.meta && c.meta.name) ? c.meta.name : ('Gość '+id.slice(0,5));
      }

      function lastMsg(c){
        if(!c.messages) return {text:'(brak wiadomości)', ts:c.meta&&c.meta.lastActive};
        const keys=Object.keys(c.messages);
        const m=c.messages[keys[keys.length-1]];
        return {text:(m.from==='user'?'👤 ':'🤖 ')+m.text, ts:m.ts, from:m.from};
      }

      function renderList(){
        const ids=Object.keys(chats).sort((a,b)=>{
          const ta=(chats[a].meta&&chats[a].meta.lastActive)||0;
          const tb=(chats[b].meta&&chats[b].meta.lastActive)||0;
          return tb-ta;
        });
        countEl.textContent=ids.length;
        listEl.innerHTML='';
        ids.forEach(id=>{
          const c=chats[id]; const lm=lastMsg(c);
          const div=document.createElement('div');
          div.className='chat'+(current===id?' active':'');
          const unread = lm.from==='user' && (!lastSeen[id] || lastSeen[id] < lm.ts);
          div.innerHTML='<div class="t"><span>'+escapeHtml(displayName(id))+
            (unread?'<span class="unread"></span>':'')+
            '</span><span class="time">'+fmtTime(lm.ts)+'</span></div>'+
            '<div class="p">'+escapeHtml(lm.text||'').slice(0,60)+'</div>';
          div.onclick=()=>openChat(id);
          listEl.appendChild(div);
        });
      }

      function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

      let msgHandler=null, msgRef=null;
      function openChat(id){
        current=id; renderList();
        document.querySelector('.wrap').classList.add('chat-open');
        document.getElementById('mHeadText').textContent=displayName(id)+' — odpisujesz jako '+(CFG.botName||'Groch');
        document.getElementById('replyForm').style.display='flex';
        document.getElementById('hint').style.display='block';
        const mEl=document.getElementById('mMsgs'); mEl.innerHTML='';

        if(msgRef&&msgHandler) msgRef.off('child_added',msgHandler);
        msgRef=db.ref('chats/'+id+'/messages');
        msgHandler=msgRef.on('child_added',snap=>{
          const m=snap.val(); if(!m)return;
          const row=document.createElement('div');
          row.className='row '+(m.from==='user'?'usr':'op');
          row.innerHTML='<div class="bubble">'+escapeHtml(m.text)+'</div>';
          mEl.appendChild(row); mEl.scrollTop=mEl.scrollHeight;
          // oznacz jako przeczytane
          if(m.ts){ lastSeen[id]=Math.max(lastSeen[id]||0,m.ts); localStorage.setItem('clide_seen',JSON.stringify(lastSeen)); }
        });
      }

      // Odpowiedź jako Clide
      const reply=document.getElementById('reply');
      let typingTimer=null;
      function setOperatorTyping(on){
        if(!current) return;
        db.ref('chats/'+current+'/typing').set(on);
        document.getElementById('typingNote').style.display=on?'block':'none';
      }
      reply.addEventListener('input',()=>{
        reply.style.height='auto'; reply.style.height=reply.scrollHeight+'px';
        if(!current) return;
        setOperatorTyping(true);
        clearTimeout(typingTimer);
        typingTimer=setTimeout(()=>setOperatorTyping(false),3000);
      });
      reply.addEventListener('keydown',e=>{
        if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('replyForm').requestSubmit();}
      });
      document.getElementById('replyForm').addEventListener('submit',e=>{
        e.preventDefault();
        const t=reply.value.trim(); if(!t||!current)return;
        reply.value=''; reply.style.height='auto';
        clearTimeout(typingTimer); setOperatorTyping(false);
        db.ref('chats/'+current+'/messages').push({
          from:'clide', text:t, ts:firebase.database.ServerValue.TIMESTAMP
        });
        db.ref('chats/'+current+'/meta').update({lastActive:firebase.database.ServerValue.TIMESTAMP});
      });

      // ── Klucz Groq z Firebase (config/groqKey) ────────────
      let groqKey='';
      db.ref('config').on('value', s=>{
        const c=s.val()||{}; groqKey=c.groqKey||'';
      });

      // ── Przełącznik auto-odpowiedzi (config/autoReply) ────
      const autoToggle=document.getElementById('autoToggle');
      db.ref('config/autoReply').on('value', s=>{ autoToggle.checked = s.val()===true; });
      autoToggle.addEventListener('change', ()=>{ db.ref('config/autoReply').set(autoToggle.checked); });

      // ── Przycisk „✨ AI”: propozycja odpowiedzi z Groq ─────
      const aiBtn=document.getElementById('aiBtn');
      async function askAI(){
        if(!current) return;
        if(!groqKey){
          alert('Brak klucza Groq.\nDodaj w Firebase → Realtime Database:\nconfig/groqKey = "gsk_..."');
          return;
        }
        const c=chats[current]; if(!c) return;
        const arr=Object.values(c.messages||{}).sort((a,b)=>(a.ts||0)-(b.ts||0));
        const g=CFG.groq||{};
        const messages=[{role:'system',content:g.system||'Jesteś pomocnym asystentem AI. Odpowiadaj po polsku.'}];
        arr.forEach(m=>messages.push({role:(m.from==='user'?'user':'assistant'),content:String(m.text||'')}));
        aiBtn.disabled=true; const old=aiBtn.textContent; aiBtn.textContent='…';
        try{
          const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+groqKey},
            body:JSON.stringify({model:g.model||'llama-3.3-70b-versatile',messages:messages,temperature:0.7})
          });
          if(!res.ok){ throw new Error('Groq '+res.status+': '+(await res.text()).slice(0,200)); }
          const data=await res.json();
          const text=(((data.choices||[])[0]||{}).message||{}).content||'';
          reply.value=text.trim();
          reply.dispatchEvent(new Event('input')); // auto-rozmiar + „Groch pisze”
          reply.focus();
        }catch(err){
          alert('Nie udało się pobrać podpowiedzi AI:\n'+err.message);
        }finally{
          aiBtn.disabled=false; aiBtn.textContent=old;
        }
      }
      aiBtn.addEventListener('click',askAI);
    }
  })();
  </script>
</body>
</html>
